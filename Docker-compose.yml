version: '3.8'

services:
  db:
    image: postgres:15
    container_name: db
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: P@ssw0rd()
      POSTGRES_DB: phone_shope
    networks:
      - app-network
    ports:
      - "5432:5432"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d phone_shope"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api-shope:
    build: .
    image: phone_shop_api:v1
    container_name: application
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/phone_shope
      SPRING_DATASOURCE_USERNAME: shop
      SPRING_DATASOURCE_PASSWORD: P@ssw0rd()
    #      SPRING_LIQUIBASE_URL: jdbc:postgresql://db:5432/phone_shope
    #      SPRING_LIQUIBASE_USER: shop
    #      SPRING_LIQUIBASE_PASSWORD: P@ssw0rd()
    networks:
      - app-network
    ports:
      - "8081:8081"

networks:
  app-network:
    driver: bridge
