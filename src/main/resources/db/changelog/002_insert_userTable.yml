databaseChangeLog:
  - changeSet:
      id: 002-create-users
      author: nimith
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)

              - column:
                  name: last_name
                  type: VARCHAR(255)

              - column:
                  name: user_name
                  type: VARCHAR(255)
                  constraints:
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)

              - column:
                  name: account_non_expired
                  type: BOOLEAN

              - column:
                  name: account_non_locked
                  type: BOOLEAN

              - column:
                  name: credentials_non_expired
                  type: BOOLEAN

              - column:
                  name: enabled
                  type: BOOLEAN

  - changeSet:
      id: 002-create-user-roles
      author: nimith
      changes:
        - createTable:
            tableName: user_roles
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false

              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
            tableName: user_roles
            columnNames: user_id, role_id
            constraintName: pk_user_roles

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: user_id
            constraintName: fk_user_roles_user

        - addForeignKeyConstraint:
            baseTableName: user_roles
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: role_id
            constraintName: fk_user_roles_role
