databaseChangeLog:
  - changeSet:
      id: 005_insert_table_user
      author: Nimith@gmail.com
      changes:
        - createTable:
            tableName: user
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: first_name
                  type: VARCHAR(255)

              - column:
                  name: last_name
                  type: VARCHAR(255)

              - column:
                  name: user_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: password
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: role
                  type: VARCHAR(50)
                  constraints:
                    nullable: false

              - column:
                  name: account_non_expired
                  type: BOOLEAN
                  defaultValueBoolean: true

              - column:
                  name: account_non_locked
                  type: BOOLEAN
                  defaultValueBoolean: true

              - column:
                  name: credentials_non_expired
                  type: BOOLEAN
                  defaultValueBoolean: true

              - column:
                  name: enabled
                  type: BOOLEAN
                  defaultValueBoolean: true