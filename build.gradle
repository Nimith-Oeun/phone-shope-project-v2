plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.unimal'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'org.postgresql:postgresql'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    //    mapstruct
    implementation 'org.mapstruct:mapstruct:1.5.5.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.5.Final'
    annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'
    //
    //  swagger
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.4'
    implementation 'org.springdoc:springdoc-openapi-ui:1.7.0'
//    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-api:2.0.2'
//    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.0.2'
    // thyemeleaf for custom Home page
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    //
    //Liquidbase
    implementation 'org.liquibase:liquibase-core:4.24.0'
    runtimeOnly("org.postgresql:postgresql")
    //
    //Validation
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    //
    // exel reader use for read exel file
    implementation 'org.apache.poi:poi:5.2.3'
    implementation 'org.apache.poi:poi-ooxml:5.2.3'
    //
    //security
    implementation 'org.springframework.boot:spring-boot-starter-security'
    //
    //JWT
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // updated to the latest version
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'
    //
    //servlet
    implementation 'javax.servlet:javax.servlet-api:4.0.1'
    //
    //H2 Db
    implementation 'com.h2database:h2'
    //
}

tasks.named('test') {
    useJUnitPlatform()
}
